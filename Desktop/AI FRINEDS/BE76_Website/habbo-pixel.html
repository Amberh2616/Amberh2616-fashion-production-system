<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BE 76 - Habbo Pixel Style</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1b1b2f;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        canvas {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .ui { position: fixed; z-index: 100; font-family: 'Courier New', monospace; }

        .header {
            top: 0; left: 0; right: 0; height: 40px;
            background: #2d2d44;
            border-bottom: 3px solid #000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px;
        }
        .logo { color: #7dd3fc; font-size: 18px; font-weight: bold; text-shadow: 2px 2px #000; }
        .room-info { display: flex; align-items: center; gap: 10px; }
        .room-name { color: #fff; font-size: 12px; }
        .online { background: #22c55e; color: #000; padding: 2px 8px; font-size: 10px; font-weight: bold; }

        .panel {
            top: 55px; left: 10px;
            background: #2d2d44; border: 3px solid #000;
            padding: 8px;
        }
        .panel-title { color: #7dd3fc; font-size: 10px; margin-bottom: 6px; border-bottom: 2px solid #444; padding-bottom: 4px; }
        .room-btn {
            display: block; width: 100%;
            background: #3d3d5c; border: 2px solid #000;
            color: #ccc; padding: 6px 10px; margin-bottom: 4px;
            font-size: 11px; font-family: 'Courier New', monospace;
            cursor: pointer; text-align: left;
        }
        .room-btn:hover { background: #4d4d6c; }
        .room-btn.active { background: #6366f1; color: #fff; }

        .chat-box {
            bottom: 10px; right: 10px; width: 260px;
            background: #2d2d44; border: 3px solid #000;
        }
        .chat-header {
            background: #6366f1; color: #fff; padding: 6px 10px;
            font-size: 12px; font-weight: bold; border-bottom: 2px solid #000;
        }
        .chat-messages {
            height: 120px; overflow-y: auto; padding: 8px;
            background: #1b1b2f;
        }
        .chat-msg {
            margin-bottom: 6px; font-size: 11px; line-height: 1.3;
            padding: 4px 6px; background: #2d2d44; border: 1px solid #444;
        }
        .chat-msg .name { color: #7dd3fc; font-weight: bold; }
        .chat-msg .text { color: #ddd; }
        .chat-input-wrap {
            display: flex; border-top: 2px solid #000;
        }
        .chat-input {
            flex: 1; padding: 8px;
            background: #1b1b2f; border: none; color: #fff;
            font-family: 'Courier New', monospace; font-size: 11px;
            outline: none;
        }
        .chat-send {
            background: #6366f1; border: none; color: #fff;
            padding: 8px 12px; font-weight: bold; cursor: pointer;
            font-family: 'Courier New', monospace;
        }

        .char-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center;
            z-index: 200;
        }
        .char-card {
            background: #2d2d44; border: 4px solid #000;
            width: 280px; text-align: center;
        }
        .char-card-header {
            background: #6366f1; color: #fff; padding: 10px;
            font-size: 14px; font-weight: bold; border-bottom: 3px solid #000;
        }
        .char-card-body { padding: 16px; }
        .char-card-avatar {
            width: 60px; height: 60px;
            background: #3d3d5c; border: 3px solid #000;
            margin: 0 auto 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
        }
        .char-card-stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 12px; }
        .char-stat { text-align: center; }
        .char-stat-label { font-size: 9px; color: #888; }
        .char-stat-value { font-size: 12px; color: #7dd3fc; font-weight: bold; }
        .char-card-desc { color: #aaa; font-size: 11px; margin-bottom: 12px; line-height: 1.4; }
        .char-card-btn {
            background: #22c55e; border: 2px solid #000;
            color: #000; padding: 8px 20px; font-weight: bold;
            cursor: pointer; font-family: 'Courier New', monospace;
        }
        .char-card-close {
            position: absolute; top: 10px; right: 10px;
            background: #ef4444; border: 2px solid #000;
            color: #fff; width: 24px; height: 24px;
            font-weight: bold; cursor: pointer;
        }

        .instructions {
            bottom: 10px; left: 10px;
            color: #666; font-size: 10px;
            background: rgba(0,0,0,0.5); padding: 6px 10px;
        }
        .instructions span { color: #7dd3fc; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>

    <header class="ui header">
        <div class="logo">BE 76</div>
        <div class="room-info">
            <span class="room-name" id="roomName">Fashion Room</span>
            <span class="online">● 12</span>
        </div>
    </header>

    <div class="ui panel">
        <div class="panel-title">ROOMS</div>
        <button class="room-btn active" onclick="changeRoom('fashion',this)">Fashion</button>
        <button class="room-btn" onclick="changeRoom('beauty',this)">Beauty</button>
        <button class="room-btn" onclick="changeRoom('travel',this)">Travel</button>
        <button class="room-btn" onclick="changeRoom('music',this)">Music</button>
    </div>

    <div class="ui chat-box">
        <div class="chat-header">CHAT</div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg"><span class="name">Amber:</span> <span class="text">Welcome! Click floor to walk~</span></div>
        </div>
        <div class="chat-input-wrap">
            <input class="chat-input" id="chatInput" placeholder="Type..." onkeypress="if(event.key==='Enter')sendChat()">
            <button class="chat-send" onclick="sendChat()">></button>
        </div>
    </div>

    <div class="ui instructions">
        <span>CLICK</span> floor to move | <span>CLICK</span> character to chat
    </div>

    <div class="char-modal" id="charModal" onclick="closeModal(event)">
        <div class="char-card" onclick="event.stopPropagation()">
            <button class="char-card-close" onclick="closeModal()">X</button>
            <div class="char-card-header" id="modalName">Amber</div>
            <div class="char-card-body">
                <div class="char-card-avatar" id="modalEmoji">👗</div>
                <div class="char-card-stats">
                    <div class="char-stat"><div class="char-stat-label">SKILL</div><div class="char-stat-value" id="modalSkill">Fashion</div></div>
                    <div class="char-stat"><div class="char-stat-label">TYPE</div><div class="char-stat-value" id="modalType">Friendly</div></div>
                    <div class="char-stat"><div class="char-stat-label">LVL</div><div class="char-stat-value" id="modalLvl">25</div></div>
                </div>
                <div class="char-card-desc" id="modalDesc">Fashion consultant!</div>
                <button class="char-card-btn" onclick="startChat()">CHAT</button>
            </div>
        </div>
    </div>

<script>
// ========== HABBO PIXEL STYLE ==========
// Key: 2:1 isometric, bold outlines, flat colors, chunky pixels

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Pixel scale (larger = bigger pixels)
const SCALE = 2;

// Tile size (in pixels, before scale)
const TW = 32;  // tile width
const TH = 16;  // tile height (2:1 ratio)
const TD = 8;   // tile depth

// Room size
const RW = 10;  // room width in tiles
const RH = 8;   // room depth in tiles
const WH = 80;  // wall height

// Colors (Habbo-style palette)
const THEMES = {
    fashion: {
        name: 'Fashion Room',
        floor1: '#c9a66b', floor2: '#b8956a',
        wall1: '#7eb8c9', wall2: '#5a9aab',
        wallLine: '#4a8a9b'
    },
    beauty: {
        name: 'Beauty Room',
        floor1: '#d4a8c0', floor2: '#c498b0',
        wall1: '#e8b8d0', wall2: '#c898b0',
        wallLine: '#b888a0'
    },
    travel: {
        name: 'Travel Room',
        floor1: '#a8c8a8', floor2: '#98b898',
        wall1: '#a8d0e0', wall2: '#88b0c0',
        wallLine: '#78a0b0'
    },
    music: {
        name: 'Music Room',
        floor1: '#b8a8d0', floor2: '#a898c0',
        wall1: '#9888c0', wall2: '#7868a0',
        wallLine: '#685890'
    }
};

const CHARS = {
    amber: { name: 'Amber', body: '#ff6b9d', hair: '#d4a574', emoji: '👗', skill: 'Fashion', type: 'Friendly', lvl: 25, desc: 'Your fashion consultant!' },
    bella: { name: 'Bella', body: '#4cc9f0', hair: '#2a2a2a', emoji: '💄', skill: 'Beauty', type: 'Creative', lvl: 18, desc: 'Beauty expert!' },
    emma: { name: 'Emma', body: '#4ade80', hair: '#e8c8a0', emoji: '✈️', skill: 'Travel', type: 'Adventure', lvl: 32, desc: 'Travel specialist!' },
    luna: { name: 'Luna', body: '#a855f7', hair: '#1a1a2a', emoji: '🎵', skill: 'Music', type: 'Artistic', lvl: 21, desc: 'Music lover!' }
};

let currentRoom = 'fashion';
let currentModalChar = null;

// Character positions
let characters = {
    amber: { x: 3, y: 4, tx: 3, ty: 4, moving: false },
    bella: { x: 6, y: 5, tx: 6, ty: 5, moving: false },
    emma: { x: 7, y: 2, tx: 7, ty: 2, moving: false },
    luna: { x: 5, y: 6, tx: 5, ty: 6, moving: false }
};

let hoverTile = null;

// ========== ISOMETRIC CONVERSION ==========
function iso(gx, gy) {
    return {
        x: (gx - gy) * TW,
        y: (gx + gy) * TH
    };
}

// ========== COLOR UTILS ==========
function darken(hex, factor) {
    const r = Math.floor(parseInt(hex.slice(1,3), 16) * factor);
    const g = Math.floor(parseInt(hex.slice(3,5), 16) * factor);
    const b = Math.floor(parseInt(hex.slice(5,7), 16) * factor);
    return `rgb(${r},${g},${b})`;
}

function lighten(hex, factor) {
    const r = Math.min(255, Math.floor(parseInt(hex.slice(1,3), 16) * factor));
    const g = Math.min(255, Math.floor(parseInt(hex.slice(3,5), 16) * factor));
    const b = Math.min(255, Math.floor(parseInt(hex.slice(5,7), 16) * factor));
    return `rgb(${r},${g},${b})`;
}

// ========== DRAWING FUNCTIONS ==========

// Draw a pixel-perfect isometric tile with outline
function drawTile(x, y, topColor, leftColor, rightColor, outline = true) {
    ctx.save();

    // Top face
    ctx.fillStyle = topColor;
    ctx.beginPath();
    ctx.moveTo(x, y - TD);
    ctx.lineTo(x + TW, y + TH - TD);
    ctx.lineTo(x, y + TH * 2 - TD);
    ctx.lineTo(x - TW, y + TH - TD);
    ctx.closePath();
    ctx.fill();

    // Left face
    ctx.fillStyle = leftColor;
    ctx.beginPath();
    ctx.moveTo(x - TW, y + TH - TD);
    ctx.lineTo(x, y + TH * 2 - TD);
    ctx.lineTo(x, y + TH * 2);
    ctx.lineTo(x - TW, y + TH);
    ctx.closePath();
    ctx.fill();

    // Right face
    ctx.fillStyle = rightColor;
    ctx.beginPath();
    ctx.moveTo(x + TW, y + TH - TD);
    ctx.lineTo(x, y + TH * 2 - TD);
    ctx.lineTo(x, y + TH * 2);
    ctx.lineTo(x + TW, y + TH);
    ctx.closePath();
    ctx.fill();

    // Bold black outline
    if (outline) {
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;

        // Top outline
        ctx.beginPath();
        ctx.moveTo(x, y - TD);
        ctx.lineTo(x + TW, y + TH - TD);
        ctx.lineTo(x, y + TH * 2 - TD);
        ctx.lineTo(x - TW, y + TH - TD);
        ctx.closePath();
        ctx.stroke();

        // Left outline
        ctx.beginPath();
        ctx.moveTo(x - TW, y + TH);
        ctx.lineTo(x, y + TH * 2);
        ctx.stroke();

        // Right outline
        ctx.beginPath();
        ctx.moveTo(x + TW, y + TH);
        ctx.lineTo(x, y + TH * 2);
        ctx.stroke();
    }

    ctx.restore();
}

// Draw a cube (for furniture/characters)
function drawCube(x, y, w, h, d, topColor, leftColor, rightColor) {
    ctx.save();

    // Top
    ctx.fillStyle = topColor;
    ctx.beginPath();
    ctx.moveTo(x, y - d);
    ctx.lineTo(x + w, y + h - d);
    ctx.lineTo(x, y + h * 2 - d);
    ctx.lineTo(x - w, y + h - d);
    ctx.closePath();
    ctx.fill();

    // Left
    ctx.fillStyle = leftColor;
    ctx.beginPath();
    ctx.moveTo(x - w, y + h - d);
    ctx.lineTo(x, y + h * 2 - d);
    ctx.lineTo(x, y + h * 2);
    ctx.lineTo(x - w, y + h);
    ctx.closePath();
    ctx.fill();

    // Right
    ctx.fillStyle = rightColor;
    ctx.beginPath();
    ctx.moveTo(x + w, y + h - d);
    ctx.lineTo(x, y + h * 2 - d);
    ctx.lineTo(x, y + h * 2);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();

    // Outline
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y - d);
    ctx.lineTo(x + w, y + h - d);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h * 2);
    ctx.lineTo(x - w, y + h);
    ctx.lineTo(x - w, y + h - d);
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y - d);
    ctx.lineTo(x, y + h * 2 - d);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - w, y + h - d);
    ctx.lineTo(x, y + h * 2 - d);
    ctx.lineTo(x + w, y + h - d);
    ctx.stroke();

    ctx.restore();
}

// Draw wall
function drawWall(points, color, lineColor) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Horizontal lines on wall
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1;
    const baseY = points[0].y;
    const topY = points[3].y;
    for (let i = 0; i < 4; i++) {
        const y = topY + (baseY - topY) * (i / 4);
        ctx.beginPath();
        ctx.moveTo(points[0].x, y);
        ctx.lineTo(points[1].x, y + (points[1].y - points[0].y) * (i / 4));
        ctx.stroke();
    }
}

// Draw window
function drawWindow(x, y, w, h) {
    // Frame
    ctx.fillStyle = '#4a5a6a';
    ctx.fillRect(x - w/2 - 3, y - 3, w + 6, h + 6);

    // Glass
    ctx.fillStyle = '#87ceeb';
    ctx.fillRect(x - w/2, y, w, h);

    // Reflection
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(x - w/2 + 2, y + 2, w/3, h/3);

    // Frame cross
    ctx.strokeStyle = '#3a4a5a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y + h);
    ctx.moveTo(x - w/2, y + h/2);
    ctx.lineTo(x + w/2, y + h/2);
    ctx.stroke();

    // Outline
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(x - w/2 - 3, y - 3, w + 6, h + 6);
}

// Draw character (Habbo style blocky avatar)
function drawCharacter(id, px, py) {
    const data = CHARS[id];
    const x = px;
    const y = py;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(x, y + TH + 4, 10, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Legs (dark blue pants)
    drawCube(x - 4, y + TH - 6, 4, 3, 10, '#3d5a80', '#2d4a70', '#1d3a60');
    drawCube(x + 4, y + TH - 6, 4, 3, 10, '#3d5a80', '#2d4a70', '#1d3a60');

    // Body
    drawCube(x, y + TH - 18, 8, 6, 14, data.body, darken(data.body, 0.75), darken(data.body, 0.55));

    // Head
    drawCube(x, y + TH - 36, 10, 7, 16, '#ffdcb8', '#e8c8a0', '#d4b090');

    // Hair (top)
    ctx.fillStyle = data.hair;
    ctx.beginPath();
    ctx.moveTo(x, y + TH - 52);
    ctx.lineTo(x + 12, y + TH - 45);
    ctx.lineTo(x, y + TH - 38);
    ctx.lineTo(x - 12, y + TH - 45);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Hair sides
    ctx.fillStyle = darken(data.hair, 0.8);
    ctx.beginPath();
    ctx.moveTo(x - 12, y + TH - 45);
    ctx.lineTo(x, y + TH - 38);
    ctx.lineTo(x, y + TH - 36);
    ctx.lineTo(x - 10, y + TH - 43);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = darken(data.hair, 0.6);
    ctx.beginPath();
    ctx.moveTo(x + 12, y + TH - 45);
    ctx.lineTo(x, y + TH - 38);
    ctx.lineTo(x, y + TH - 36);
    ctx.lineTo(x + 10, y + TH - 43);
    ctx.closePath();
    ctx.fill();

    // Eyes (simple dots)
    ctx.fillStyle = '#000';
    ctx.fillRect(x - 5, y + TH - 42, 3, 3);
    ctx.fillRect(x + 2, y + TH - 42, 3, 3);

    // Eye shine
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 4, y + TH - 41, 1, 1);
    ctx.fillRect(x + 3, y + TH - 41, 1, 1);

    // Blush
    ctx.fillStyle = 'rgba(255,180,180,0.6)';
    ctx.fillRect(x - 9, y + TH - 38, 3, 2);
    ctx.fillRect(x + 6, y + TH - 38, 3, 2);

    // Mouth
    ctx.fillStyle = '#d08080';
    ctx.fillRect(x - 1, y + TH - 34, 3, 2);

    // Name tag
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    const nameWidth = ctx.measureText(data.name).width + 8;
    ctx.fillRect(x - nameWidth/2, y + TH + 10, nameWidth, 12);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(x - nameWidth/2, y + TH + 10, nameWidth, 12);

    ctx.fillStyle = '#fff';
    ctx.font = '9px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(data.name, x, y + TH + 19);
}

// Draw sofa
function drawSofa(gx, gy) {
    const p = iso(gx, gy);
    const x = p.x + TW;
    const y = p.y + TH;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(x, y + TH + 6, 35, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Seat
    drawCube(x, y, 32, 18, 10, '#dc3545', '#b91c1c', '#991b1b');

    // Back
    drawCube(x - 22, y - 8, 12, 22, 28, '#b91c1c', '#991b1b', '#7f1d1d');

    // Arm
    drawCube(x + 24, y + 4, 10, 12, 14, '#b91c1c', '#991b1b', '#7f1d1d');
}

// Draw table
function drawTable(gx, gy) {
    const p = iso(gx, gy);
    const x = p.x + TW;
    const y = p.y + TH;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(x, y + TH + 4, 24, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Legs
    drawCube(x - 14, y + 6, 3, 3, 16, '#5d4037', '#4a3025', '#3e2518');
    drawCube(x + 14, y + 6, 3, 3, 16, '#5d4037', '#4a3025', '#3e2518');
    drawCube(x - 8, y + 14, 3, 3, 16, '#5d4037', '#4a3025', '#3e2518');
    drawCube(x + 8, y + 14, 3, 3, 16, '#5d4037', '#4a3025', '#3e2518');

    // Top
    drawCube(x, y - 6, 22, 14, 4, '#8d6e63', '#6d5040', '#5d4030');

    // Cup on table
    ctx.fillStyle = '#f5f5f5';
    ctx.beginPath();
    ctx.ellipse(x + 6, y - 9, 5, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
}

// Draw plant
function drawPlant(gx, gy) {
    const p = iso(gx, gy);
    const x = p.x + TW;
    const y = p.y + TH;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(x, y + TH + 3, 12, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Pot
    drawCube(x, y + 4, 12, 8, 18, '#d2691e', '#a05014', '#804010');

    // Soil
    ctx.fillStyle = '#3e2723';
    ctx.beginPath();
    ctx.ellipse(x, y - 12, 8, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Leaves
    const leafPositions = [[0, -32], [-7, -26], [7, -26], [-4, -20], [4, -20]];
    leafPositions.forEach(([dx, dy]) => {
        ctx.fillStyle = '#2e7d32';
        ctx.beginPath();
        ctx.ellipse(x + dx, y + dy, 6, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#1b5e20';
        ctx.lineWidth = 1;
        ctx.stroke();
    });
}

// Draw rug
function drawRug(gx, gy, w, h) {
    const c0 = iso(gx, gy);
    const c1 = iso(gx + w, gy);
    const c2 = iso(gx + w, gy + h);
    const c3 = iso(gx, gy + h);

    // Main rug
    ctx.fillStyle = '#7c3aed';
    ctx.beginPath();
    ctx.moveTo(c0.x, c0.y + TH);
    ctx.lineTo(c1.x, c1.y + TH);
    ctx.lineTo(c2.x, c2.y + TH);
    ctx.lineTo(c3.x, c3.y + TH);
    ctx.closePath();
    ctx.fill();

    // Border
    ctx.strokeStyle = '#5b21b6';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Inner pattern
    ctx.fillStyle = '#9b5de5';
    ctx.beginPath();
    const inset = 0.15;
    const i0 = iso(gx + w*inset, gy + h*inset);
    const i1 = iso(gx + w*(1-inset), gy + h*inset);
    const i2 = iso(gx + w*(1-inset), gy + h*(1-inset));
    const i3 = iso(gx + w*inset, gy + h*(1-inset));
    ctx.moveTo(i0.x, i0.y + TH);
    ctx.lineTo(i1.x, i1.y + TH);
    ctx.lineTo(i2.x, i2.y + TH);
    ctx.lineTo(i3.x, i3.y + TH);
    ctx.closePath();
    ctx.fill();
}

// ========== MAIN RENDER ==========
function render() {
    const theme = THEMES[currentRoom];

    // Clear
    ctx.fillStyle = '#1b1b2f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();

    // Center the room
    const centerX = canvas.width / 2 / SCALE;
    const centerY = canvas.height / 2 / SCALE;
    const roomCenter = iso(RW/2, RH/2);
    ctx.translate(centerX - roomCenter.x, centerY - roomCenter.y - 20);
    ctx.scale(SCALE, SCALE);

    // === BACK WALL ===
    const bw0 = iso(0, 0);
    const bw1 = iso(RW, 0);
    drawWall([
        { x: bw0.x, y: bw0.y },
        { x: bw1.x, y: bw1.y },
        { x: bw1.x, y: bw1.y - WH },
        { x: bw0.x, y: bw0.y - WH }
    ], theme.wall1, theme.wallLine);

    // Windows on back wall
    const win1 = iso(2.5, 0);
    const win2 = iso(7.5, 0);
    drawWindow(win1.x, win1.y - WH + 20, 28, 36);
    drawWindow(win2.x, win2.y - WH + 20, 28, 36);

    // === SIDE WALL ===
    const sw0 = iso(RW, 0);
    const sw1 = iso(RW, RH);
    drawWall([
        { x: sw0.x, y: sw0.y },
        { x: sw1.x, y: sw1.y },
        { x: sw1.x, y: sw1.y - WH },
        { x: sw0.x, y: sw0.y - WH }
    ], theme.wall2, darken(theme.wallLine, 0.9));

    // Window on side wall
    const win3 = iso(RW, 4);
    drawWindow(win3.x - 10, win3.y - WH + 20, 24, 32);

    // Corner line
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sw0.x, sw0.y - WH);
    ctx.lineTo(sw0.x, sw0.y);
    ctx.stroke();

    // === RUG (before floor for layering) ===
    drawRug(3, 3, 4, 3);

    // === FLOOR TILES ===
    for (let gy = 0; gy < RH; gy++) {
        for (let gx = 0; gx < RW; gx++) {
            const p = iso(gx, gy);
            const isLight = (gx + gy) % 2 === 0;
            const topColor = isLight ? theme.floor1 : theme.floor2;
            const leftColor = darken(topColor, 0.6);
            const rightColor = darken(topColor, 0.4);

            // Hover highlight
            if (hoverTile && hoverTile.x === gx && hoverTile.y === gy) {
                drawTile(p.x, p.y, lighten(topColor, 1.2), leftColor, rightColor);
            } else {
                drawTile(p.x, p.y, topColor, leftColor, rightColor);
            }
        }
    }

    // === FURNITURE ===
    drawSofa(1, 2);
    drawTable(5, 5);
    drawPlant(8, 1);

    // === CHARACTERS (sorted by depth) ===
    const sortedChars = Object.entries(characters).sort((a, b) => {
        return (a[1].x + a[1].y) - (b[1].x + b[1].y);
    });

    sortedChars.forEach(([id, char]) => {
        const p = iso(char.x, char.y);
        drawCharacter(id, p.x + TW, p.y + TH - TD);
    });

    ctx.restore();
}

// ========== INPUT HANDLING ==========
function getMouseTile(e) {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / SCALE;
    const my = (e.clientY - rect.top) / SCALE;

    const centerX = canvas.width / 2 / SCALE;
    const centerY = canvas.height / 2 / SCALE;
    const roomCenter = iso(RW/2, RH/2);

    const relX = mx - (centerX - roomCenter.x);
    const relY = my - (centerY - roomCenter.y - 20);

    // Reverse isometric conversion
    const gx = (relX / TW + relY / TH) / 2;
    const gy = (relY / TH - relX / TW) / 2;

    return { x: Math.floor(gx), y: Math.floor(gy) };
}

function isValidTile(gx, gy) {
    return gx >= 0 && gx < RW && gy >= 0 && gy < RH;
}

function getCharacterAt(gx, gy) {
    for (const [id, char] of Object.entries(characters)) {
        if (Math.abs(char.x - gx) < 1 && Math.abs(char.y - gy) < 1) {
            return id;
        }
    }
    return null;
}

canvas.addEventListener('mousemove', (e) => {
    const tile = getMouseTile(e);
    if (isValidTile(tile.x, tile.y)) {
        hoverTile = tile;
        canvas.style.cursor = 'pointer';
    } else {
        hoverTile = null;
        canvas.style.cursor = 'default';
    }
});

canvas.addEventListener('click', (e) => {
    const tile = getMouseTile(e);
    if (!isValidTile(tile.x, tile.y)) return;

    // Check if clicked on character
    const charId = getCharacterAt(tile.x, tile.y);
    if (charId) {
        showModal(charId);
        return;
    }

    // Move amber to clicked tile
    moveCharacter('amber', tile.x, tile.y);
});

// ========== CHARACTER MOVEMENT ==========
function moveCharacter(id, tx, ty) {
    const char = characters[id];
    if (char.moving) return;

    char.tx = tx;
    char.ty = ty;
    char.moving = true;

    const startX = char.x;
    const startY = char.y;
    const duration = 400;
    const startTime = Date.now();

    function animate() {
        const elapsed = Date.now() - startTime;
        const t = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3);

        char.x = startX + (tx - startX) * ease;
        char.y = startY + (ty - startY) * ease;

        if (t < 1) {
            requestAnimationFrame(animate);
        } else {
            char.x = tx;
            char.y = ty;
            char.moving = false;
            addChat(`${CHARS[id].name} moved!`, 'ai', CHARS[id].name);
        }
    }

    animate();
}

// ========== UI FUNCTIONS ==========
function addChat(text, type, name = 'You') {
    const messages = document.getElementById('chatMessages');
    const msg = document.createElement('div');
    msg.className = 'chat-msg';
    msg.innerHTML = `<span class="name">${name}:</span> <span class="text">${text}</span>`;
    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
}

function sendChat() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    addChat(text, 'user');
    input.value = '';

    setTimeout(() => {
        const responses = [
            ['Amber', 'Nice!'],
            ['Bella', 'Cool!'],
            ['Emma', 'Great!'],
            ['Luna', 'Love it!']
        ];
        const [name, msg] = responses[Math.floor(Math.random() * responses.length)];
        addChat(msg, 'ai', name);
    }, 500);
}

function changeRoom(id, btn) {
    currentRoom = id;
    document.getElementById('roomName').textContent = THEMES[id].name;
    document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    addChat(`Welcome to ${THEMES[id].name}!`, 'ai', 'System');
}

function showModal(id) {
    const data = CHARS[id];
    currentModalChar = data;
    document.getElementById('modalName').textContent = data.name;
    document.getElementById('modalEmoji').textContent = data.emoji;
    document.getElementById('modalSkill').textContent = data.skill;
    document.getElementById('modalType').textContent = data.type;
    document.getElementById('modalLvl').textContent = data.lvl;
    document.getElementById('modalDesc').textContent = data.desc;
    document.getElementById('charModal').style.display = 'flex';
}

function closeModal(e) {
    if (!e || e.target.id === 'charModal') {
        document.getElementById('charModal').style.display = 'none';
    }
}

function startChat() {
    if (currentModalChar) {
        addChat(`Hi! I'm ${currentModalChar.name}!`, 'ai', currentModalChar.name);
    }
    closeModal();
}

// ========== INIT ==========
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function gameLoop() {
    render();
    requestAnimationFrame(gameLoop);
}

window.addEventListener('resize', resize);
window.changeRoom = changeRoom;
window.sendChat = sendChat;
window.showModal = showModal;
window.closeModal = closeModal;
window.startChat = startChat;

resize();
gameLoop();
</script>
</body>
</html>
