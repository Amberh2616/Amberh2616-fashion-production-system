<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BE 76 - Habbo Style Room</title>
    <script src="https://pixijs.download/v7.3.2/pixi.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        #game { position: fixed; top: 0; left: 0; }

        .ui { position: fixed; z-index: 100; }

        .header {
            top: 0; left: 0; right: 0; height: 50px;
            background: linear-gradient(180deg, rgba(30,30,60,0.98) 0%, rgba(20,20,45,0.95) 100%);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px;
            border-bottom: 2px solid #6366f1;
            box-shadow: 0 4px 20px rgba(99,102,241,0.3);
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(168,85,247,0.5);
        }
        .room-info {
            display: flex; align-items: center; gap: 12px;
        }
        .room-name { color: #e0e0e0; font-size: 0.95rem; font-weight: 500; }
        .badge {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white; padding: 4px 10px; border-radius: 12px;
            font-size: 0.75rem; font-weight: 600;
            box-shadow: 0 2px 10px rgba(34,197,94,0.4);
        }

        .panel {
            top: 65px; left: 15px;
            background: linear-gradient(180deg, rgba(30,30,60,0.95) 0%, rgba(25,25,50,0.9) 100%);
            padding: 12px; border-radius: 12px;
            border: 1px solid rgba(99,102,241,0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .panel-title {
            color: #a5b4fc; font-size: 0.7rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 8px; padding-bottom: 6px;
            border-bottom: 1px solid rgba(99,102,241,0.2);
        }
        .rbtn {
            display: block; width: 100%;
            background: rgba(99,102,241,0.1);
            border: 1px solid rgba(99,102,241,0.3);
            color: #a5b4fc;
            padding: 8px 14px; margin-bottom: 6px; border-radius: 8px;
            cursor: pointer; font-size: 12px; font-weight: 600;
            transition: all 0.3s ease;
            text-align: left;
        }
        .rbtn:last-child { margin: 0; }
        .rbtn:hover {
            background: rgba(99,102,241,0.25);
            border-color: #6366f1;
            transform: translateX(3px);
        }
        .rbtn.on {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(99,102,241,0.4);
        }

        .chat {
            bottom: 15px; right: 15px; width: 300px;
            background: linear-gradient(180deg, rgba(30,30,60,0.98) 0%, rgba(25,25,50,0.95) 100%);
            border-radius: 16px;
            border: 1px solid rgba(99,102,241,0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .chat-head {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            color: white; padding: 12px 16px;
            font-size: 13px; font-weight: 600;
            display: flex; justify-content: space-between; align-items: center;
        }
        .chat-head button {
            background: rgba(255,255,255,0.2);
            border: none; color: white;
            width: 24px; height: 24px; border-radius: 50%;
            cursor: pointer; font-size: 10px;
            transition: background 0.2s;
        }
        .chat-head button:hover { background: rgba(255,255,255,0.3); }
        .chat-body { height: 180px; overflow-y: auto; padding: 12px; }
        .chat-body::-webkit-scrollbar { width: 4px; }
        .chat-body::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .chat-body::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 2px; }
        .cmsg {
            margin-bottom: 10px; padding: 10px 12px;
            border-radius: 12px; font-size: 12px; line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .cmsg.ai {
            background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(139,92,246,0.15));
            border-left: 3px solid #6366f1;
            color: #e0e0e0;
        }
        .cmsg.user {
            background: rgba(255,255,255,0.08);
            color: #d0d0d0;
            border-left: 3px solid #4ade80;
        }
        .cmsg .name { color: #a5b4fc; font-weight: 600; }
        .chat-input {
            padding: 12px;
            border-top: 1px solid rgba(99,102,241,0.2);
            display: flex; gap: 8px;
        }
        .chat-input input {
            flex: 1; padding: 10px 14px;
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            color: white; font-size: 12px; outline: none;
            transition: border-color 0.2s;
        }
        .chat-input input:focus { border-color: #6366f1; }
        .chat-input input::placeholder { color: #666; }
        .chat-input button {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none; color: white;
            width: 36px; height: 36px; border-radius: 50%;
            cursor: pointer; font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .chat-input button:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(99,102,241,0.5);
        }

        .modal-bg {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center;
            z-index: 200;
        }
        .modal {
            background: linear-gradient(180deg, #2a2a50 0%, #1e1e3a 100%);
            border-radius: 20px; width: 90%; max-width: 340px;
            border: 1px solid rgba(99,102,241,0.3);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .modal-head {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            color: white; padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-head h3 { margin: 0; font-size: 1.1rem; }
        .modal-head button {
            background: rgba(255,255,255,0.2);
            border: none; color: white;
            width: 28px; height: 28px; border-radius: 50%;
            cursor: pointer; font-size: 14px;
        }
        .modal-body { padding: 24px; text-align: center; }
        .modal-avatar {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; margin: 0 auto 16px;
            box-shadow: 0 8px 25px rgba(99,102,241,0.4);
        }
        .modal-stats {
            display: flex; justify-content: center; gap: 24px;
            margin-bottom: 16px;
        }
        .modal-stat { text-align: center; }
        .modal-stat small {
            font-size: 10px; color: #888;
            text-transform: uppercase; letter-spacing: 1px;
            display: block; margin-bottom: 4px;
        }
        .modal-stat span { font-size: 14px; font-weight: 600; color: #a5b4fc; }
        .modal-desc { color: #aaa; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
        .modal-btn {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white; border: none;
            padding: 12px 32px; border-radius: 25px;
            font-weight: 600; font-size: 14px; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .modal-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(99,102,241,0.5);
        }

        .instructions {
            bottom: 15px; left: 15px;
            background: rgba(0,0,0,0.6);
            padding: 10px 14px; border-radius: 10px;
            color: #888; font-size: 11px;
        }
        .instructions span { color: #a5b4fc; }
    </style>
</head>
<body>
    <div id="game"></div>

    <header class="ui header">
        <div class="logo">BE 76</div>
        <div class="room-info">
            <span class="room-name" id="roomName">Fashion Lounge</span>
            <span class="badge">12 online</span>
        </div>
    </header>

    <div class="ui panel">
        <div class="panel-title">Rooms</div>
        <button class="rbtn on" onclick="changeRoom('fashion',this)">Fashion Lounge</button>
        <button class="rbtn" onclick="changeRoom('beauty',this)">Beauty Studio</button>
        <button class="rbtn" onclick="changeRoom('travel',this)">Travel Hub</button>
        <button class="rbtn" onclick="changeRoom('music',this)">Music Room</button>
    </div>

    <div class="ui chat">
        <div class="chat-head">
            <span>Chat</span>
            <button onclick="toggleChat()">−</button>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="cmsg ai"><span class="name">Amber:</span> Welcome! Click the floor to walk around~</div>
        </div>
        <div class="chat-input">
            <input id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendChat()">
            <button onclick="sendChat()">➤</button>
        </div>
    </div>

    <div class="ui instructions">
        <span>Click</span> floor to move · <span>Click</span> character to chat
    </div>

    <div class="modal-bg" id="modalBg" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-head">
                <h3 id="modalName">Amber</h3>
                <button onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-avatar" id="modalEmoji">👗</div>
                <div class="modal-stats">
                    <div class="modal-stat"><small>Expertise</small><span id="modalSkill">Fashion</span></div>
                    <div class="modal-stat"><small>Personality</small><span id="modalPersonality">Friendly</span></div>
                    <div class="modal-stat"><small>Level</small><span id="modalLevel">25</span></div>
                </div>
                <p class="modal-desc" id="modalDesc">Hi! I'm Amber, your fashion consultant!</p>
                <button class="modal-btn" onclick="startConversation()">Start Chat</button>
            </div>
        </div>
    </div>

<script>
const TW = 40;
const TH = 20;
const TD = 10;
const RW = 10;
const RH = 8;
const WH = 140;

const ROOMS = {
    fashion: {
        name: 'Fashion Lounge',
        floorLight: 0xc9a66b, floorDark: 0xb8956a,
        wallBack: 0x7eb8c9, wallSide: 0x5a9aab,
        accent: 0xff6b9d
    },
    beauty: {
        name: 'Beauty Studio',
        floorLight: 0xd4b8a0, floorDark: 0xc4a890,
        wallBack: 0xd4a0b8, wallSide: 0xb480a0,
        accent: 0xff69b4
    },
    travel: {
        name: 'Travel Hub',
        floorLight: 0xa8c4a8, floorDark: 0x98b498,
        wallBack: 0xa0c4d4, wallSide: 0x80a4b4,
        accent: 0x4ecdc4
    },
    music: {
        name: 'Music Room',
        floorLight: 0xb8a8c8, floorDark: 0xa898b8,
        wallBack: 0x9088b0, wallSide: 0x706890,
        accent: 0xa855f7
    }
};

const CHARACTERS = {
    amber: { name:'Amber', bodyColor:0xff6b9d, hairColor:0xd4a574, emoji:'👗', skill:'Fashion', personality:'Friendly', level:25, desc:'Fashion consultant who loves helping you find your style!' },
    bella: { name:'Bella', bodyColor:0x4cc9f0, hairColor:0x2a2a2a, emoji:'💄', skill:'Beauty', personality:'Creative', level:18, desc:'Beauty expert specializing in skincare and makeup!' },
    emma:  { name:'Emma',  bodyColor:0x4ade80, hairColor:0xe8c8a0, emoji:'✈️', skill:'Travel', personality:'Adventurous', level:32, desc:'Travel enthusiast who has visited 50+ countries!' },
    luna:  { name:'Luna',  bodyColor:0xa855f7, hairColor:0x1a1a2a, emoji:'🎵', skill:'Music', personality:'Artistic', level:21, desc:'Music lover with great taste in all genres!' }
};

let app, mainContainer;
let characters = {};
let currentRoom = 'fashion';
let currentModalChar = null;

function iso(gx, gy) {
    return { x: (gx - gy) * TW, y: (gx + gy) * TH };
}

function darken(color, factor) {
    const r = Math.floor(((color >> 16) & 0xff) * factor);
    const g = Math.floor(((color >> 8) & 0xff) * factor);
    const b = Math.floor((color & 0xff) * factor);
    return (r << 16) | (g << 8) | b;
}

function lighten(color, factor) {
    const r = Math.min(255, Math.floor(((color >> 16) & 0xff) * factor));
    const g = Math.min(255, Math.floor(((color >> 8) & 0xff) * factor));
    const b = Math.min(255, Math.floor((color & 0xff) * factor));
    return (r << 16) | (g << 8) | b;
}

function init() {
    app = new PIXI.Application({
        width: window.innerWidth,
        height: window.innerHeight,
        backgroundColor: 0x1a1a2e,
        antialias: true,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true
    });
    document.getElementById('game').appendChild(app.view);

    mainContainer = new PIXI.Container();
    mainContainer.sortableChildren = true;
    app.stage.addChild(mainContainer);

    centerRoom();
    buildRoom();
    createCharacters();

    window.addEventListener('resize', () => {
        app.renderer.resize(window.innerWidth, window.innerHeight);
        centerRoom();
    });

    app.ticker.add(gameLoop);
}

function centerRoom() {
    const center = iso(RW / 2, RH / 2);
    mainContainer.x = app.screen.width / 2 - center.x;
    mainContainer.y = app.screen.height / 2 - center.y + 30;
}

function buildRoom() {
    mainContainer.removeChildren();
    const theme = ROOMS[currentRoom];

    // Back wall
    const backWall = new PIXI.Graphics();
    backWall.zIndex = 0;

    const bw0 = iso(0, 0);
    const bw1 = iso(RW, 0);

    // Wall gradient effect
    backWall.beginFill(theme.wallBack);
    backWall.moveTo(bw0.x, bw0.y);
    backWall.lineTo(bw1.x, bw1.y);
    backWall.lineTo(bw1.x, bw1.y - WH);
    backWall.lineTo(bw0.x, bw0.y - WH);
    backWall.closePath();
    backWall.endFill();

    // Wall stripes pattern
    backWall.lineStyle(0);
    for (let i = 0; i < 12; i++) {
        const alpha = (i % 2 === 0) ? 0.08 : 0.04;
        backWall.beginFill(0xffffff, alpha);
        const x1 = bw0.x + (bw1.x - bw0.x) * (i / 12);
        const x2 = bw0.x + (bw1.x - bw0.x) * ((i + 1) / 12);
        const y1 = bw0.y + (bw1.y - bw0.y) * (i / 12);
        const y2 = bw0.y + (bw1.y - bw0.y) * ((i + 1) / 12);
        backWall.moveTo(x1, y1);
        backWall.lineTo(x2, y2);
        backWall.lineTo(x2, y2 - WH);
        backWall.lineTo(x1, y1 - WH);
        backWall.closePath();
        backWall.endFill();
    }

    // Wall top edge
    backWall.beginFill(lighten(theme.wallBack, 1.3));
    backWall.moveTo(bw0.x, bw0.y - WH);
    backWall.lineTo(bw1.x, bw1.y - WH);
    backWall.lineTo(bw1.x + 8, bw1.y - WH + 4);
    backWall.lineTo(bw0.x + 8, bw0.y - WH + 4);
    backWall.closePath();
    backWall.endFill();

    // Decorative line
    backWall.lineStyle(3, darken(theme.wallBack, 0.7));
    backWall.moveTo(bw0.x, bw0.y - 30);
    backWall.lineTo(bw1.x, bw1.y - 30);

    // Windows
    drawWindow(backWall, iso(2.5, 0), 50, 60, theme);
    drawWindow(backWall, iso(7.5, 0), 50, 60, theme);

    // Picture frame
    drawPicture(backWall, iso(5, 0), 40, 30);

    mainContainer.addChild(backWall);

    // Side wall
    const sideWall = new PIXI.Graphics();
    sideWall.zIndex = 0;

    const sw0 = iso(RW, 0);
    const sw1 = iso(RW, RH);

    sideWall.beginFill(theme.wallSide);
    sideWall.moveTo(sw0.x, sw0.y);
    sideWall.lineTo(sw1.x, sw1.y);
    sideWall.lineTo(sw1.x, sw1.y - WH);
    sideWall.lineTo(sw0.x, sw0.y - WH);
    sideWall.closePath();
    sideWall.endFill();

    // Side wall stripes
    for (let i = 0; i < 8; i++) {
        const alpha = (i % 2 === 0) ? 0.06 : 0.03;
        sideWall.beginFill(0xffffff, alpha);
        const x1 = sw0.x + (sw1.x - sw0.x) * (i / 8);
        const x2 = sw0.x + (sw1.x - sw0.x) * ((i + 1) / 8);
        const y1 = sw0.y + (sw1.y - sw0.y) * (i / 8);
        const y2 = sw0.y + (sw1.y - sw0.y) * ((i + 1) / 8);
        sideWall.moveTo(x1, y1);
        sideWall.lineTo(x2, y2);
        sideWall.lineTo(x2, y2 - WH);
        sideWall.lineTo(x1, y1 - WH);
        sideWall.closePath();
        sideWall.endFill();
    }

    // Side wall top
    sideWall.beginFill(lighten(theme.wallSide, 1.2));
    sideWall.moveTo(sw0.x, sw0.y - WH);
    sideWall.lineTo(sw1.x, sw1.y - WH);
    sideWall.lineTo(sw1.x - 8, sw1.y - WH + 4);
    sideWall.lineTo(sw0.x - 8, sw0.y - WH + 4);
    sideWall.closePath();
    sideWall.endFill();

    // Corner edge
    sideWall.lineStyle(2, darken(theme.wallSide, 0.5));
    sideWall.moveTo(sw0.x, sw0.y - WH);
    sideWall.lineTo(sw0.x, sw0.y);

    // Side window
    drawWindow(sideWall, iso(RW, 4), 40, 50, theme);

    mainContainer.addChild(sideWall);

    // Floor tiles
    for (let gx = 0; gx < RW; gx++) {
        for (let gy = 0; gy < RH; gy++) {
            createFloorTile(gx, gy, theme);
        }
    }

    // Furniture
    createSofa(1, 2, theme);
    createCoffeeTable(4, 4, theme);
    createPlant(8, 1);
    createLamp(1, 6);
    createRug(3, 3, 4, 3, theme);
}

function drawWindow(g, pos, w, h, theme) {
    const x = pos.x;
    const y = pos.y - WH + 35;

    // Window frame
    g.lineStyle(0);
    g.beginFill(0x2a3a4a);
    g.drawRoundedRect(x - w/2 - 4, y - 4, w + 8, h + 8, 3);
    g.endFill();

    // Glass with gradient
    g.beginFill(0x87ceeb);
    g.drawRect(x - w/2, y, w, h);
    g.endFill();

    // Sky reflection
    g.beginFill(0xadd8e6, 0.6);
    g.drawRect(x - w/2, y, w, h * 0.4);
    g.endFill();

    // Light reflection
    g.beginFill(0xffffff, 0.4);
    g.drawRect(x - w/2 + 3, y + 3, w * 0.3, h * 0.2);
    g.endFill();

    // Window frame lines
    g.lineStyle(3, 0x4a5a6a);
    g.moveTo(x, y);
    g.lineTo(x, y + h);
    g.moveTo(x - w/2, y + h/2);
    g.lineTo(x + w/2, y + h/2);

    // Curtains
    g.lineStyle(0);
    g.beginFill(theme.accent, 0.7);
    g.moveTo(x - w/2 - 8, y - 8);
    g.lineTo(x - w/2 - 8, y + h + 10);
    g.quadraticCurveTo(x - w/2 + 5, y + h/2, x - w/2 - 3, y - 8);
    g.closePath();
    g.endFill();

    g.beginFill(theme.accent, 0.7);
    g.moveTo(x + w/2 + 8, y - 8);
    g.lineTo(x + w/2 + 8, y + h + 10);
    g.quadraticCurveTo(x + w/2 - 5, y + h/2, x + w/2 + 3, y - 8);
    g.closePath();
    g.endFill();
}

function drawPicture(g, pos, w, h) {
    const x = pos.x;
    const y = pos.y - WH + 70;

    // Frame
    g.lineStyle(0);
    g.beginFill(0x8b4513);
    g.drawRect(x - w/2 - 4, y - 4, w + 8, h + 8);
    g.endFill();

    // Picture content
    g.beginFill(0x4a6fa5);
    g.drawRect(x - w/2, y, w, h);
    g.endFill();

    // Simple landscape
    g.beginFill(0x87ceeb);
    g.drawRect(x - w/2, y, w, h * 0.6);
    g.endFill();

    g.beginFill(0x228b22);
    g.moveTo(x - w/2, y + h * 0.6);
    g.lineTo(x - w/4, y + h * 0.3);
    g.lineTo(x, y + h * 0.6);
    g.closePath();
    g.endFill();

    g.beginFill(0x2e8b2e);
    g.moveTo(x, y + h * 0.6);
    g.lineTo(x + w/4, y + h * 0.4);
    g.lineTo(x + w/2, y + h * 0.6);
    g.closePath();
    g.endFill();
}

function createFloorTile(gx, gy, theme) {
    const p = iso(gx, gy);
    const tile = new PIXI.Graphics();
    tile.zIndex = 10 + gx + gy;

    const isLight = (gx + gy) % 2 === 0;
    const topColor = isLight ? theme.floorLight : theme.floorDark;
    const leftColor = darken(topColor, 0.6);
    const rightColor = darken(topColor, 0.4);

    // Top face
    tile.beginFill(topColor);
    tile.moveTo(p.x, p.y - TD);
    tile.lineTo(p.x + TW, p.y + TH - TD);
    tile.lineTo(p.x, p.y + TH * 2 - TD);
    tile.lineTo(p.x - TW, p.y + TH - TD);
    tile.closePath();
    tile.endFill();

    // Wood grain effect
    tile.lineStyle(1, darken(topColor, 0.85), 0.3);
    for (let i = 0; i < 3; i++) {
        const offset = (i - 1) * 8;
        tile.moveTo(p.x - TW * 0.6 + offset, p.y + TH * 0.4 - TD + offset * 0.5);
        tile.lineTo(p.x + TW * 0.6 + offset, p.y + TH * 1.6 - TD + offset * 0.5);
    }

    // Left face
    tile.lineStyle(0);
    tile.beginFill(leftColor);
    tile.moveTo(p.x - TW, p.y + TH - TD);
    tile.lineTo(p.x, p.y + TH * 2 - TD);
    tile.lineTo(p.x, p.y + TH * 2);
    tile.lineTo(p.x - TW, p.y + TH);
    tile.closePath();
    tile.endFill();

    // Right face
    tile.beginFill(rightColor);
    tile.moveTo(p.x + TW, p.y + TH - TD);
    tile.lineTo(p.x, p.y + TH * 2 - TD);
    tile.lineTo(p.x, p.y + TH * 2);
    tile.lineTo(p.x + TW, p.y + TH);
    tile.closePath();
    tile.endFill();

    // Highlight
    tile.beginFill(0xffffff, 0.12);
    tile.moveTo(p.x, p.y - TD);
    tile.lineTo(p.x + TW * 0.5, p.y + TH * 0.5 - TD);
    tile.lineTo(p.x, p.y + TH - TD);
    tile.lineTo(p.x - TW * 0.5, p.y + TH * 0.5 - TD);
    tile.closePath();
    tile.endFill();

    // Interaction
    tile.eventMode = 'static';
    tile.cursor = 'pointer';
    tile.hitArea = new PIXI.Polygon([
        p.x, p.y - TD,
        p.x + TW, p.y + TH - TD,
        p.x, p.y + TH * 2 - TD,
        p.x - TW, p.y + TH - TD
    ]);

    tile.on('pointerdown', () => moveCharacter('amber', gx, gy));
    tile.on('pointerover', () => { tile.alpha = 0.8; });
    tile.on('pointerout', () => { tile.alpha = 1; });

    mainContainer.addChild(tile);
}

function drawCube(g, x, y, w, h, d, topColor, leftColor, rightColor) {
    // Top
    g.beginFill(topColor);
    g.moveTo(x, y - d);
    g.lineTo(x + w, y + h - d);
    g.lineTo(x, y + h * 2 - d);
    g.lineTo(x - w, y + h - d);
    g.closePath();
    g.endFill();

    // Left
    g.beginFill(leftColor);
    g.moveTo(x - w, y + h - d);
    g.lineTo(x, y + h * 2 - d);
    g.lineTo(x, y + h * 2);
    g.lineTo(x - w, y + h);
    g.closePath();
    g.endFill();

    // Right
    g.beginFill(rightColor);
    g.moveTo(x + w, y + h - d);
    g.lineTo(x, y + h * 2 - d);
    g.lineTo(x, y + h * 2);
    g.lineTo(x + w, y + h);
    g.closePath();
    g.endFill();
}

function createSofa(gx, gy, theme) {
    const p = iso(gx, gy);
    const g = new PIXI.Graphics();
    g.zIndex = 100 + gx + gy;

    const baseColor = 0xdc3545;
    const darkColor = darken(baseColor, 0.7);
    const darkerColor = darken(baseColor, 0.5);

    // Shadow
    g.beginFill(0x000000, 0.3);
    g.drawEllipse(p.x + TW, p.y + TH * 2 + 8, 50, 15);
    g.endFill();

    // Seat
    drawCube(g, p.x + TW, p.y + TH, 45, 25, 15, baseColor, darkColor, darkerColor);

    // Back
    drawCube(g, p.x + TW - 32, p.y + TH - 15, 15, 30, 35, darkColor, darkerColor, darken(baseColor, 0.4));

    // Arm rest
    drawCube(g, p.x + TW + 35, p.y + TH + 5, 12, 15, 18, darkColor, darkerColor, darken(baseColor, 0.4));

    // Cushion details
    g.lineStyle(2, darkerColor);
    g.moveTo(p.x + TW - 10, p.y + TH - 5);
    g.lineTo(p.x + TW + 15, p.y + TH + 8);

    mainContainer.addChild(g);
}

function createCoffeeTable(gx, gy, theme) {

    g.zIndex = 100 + gx + gy;

    // Shadow
    g.beginFill(0x000000, 0.25);

    // Legs
    const legColor = 0x5d4037;
    const legDark = darken(legColor, 0.7);
    const legDarker = darken(legColor, 0.5);

    drawCube(g, p.x + TW - 22, p.y + TH + 10, 4, 4, 25, legColor, legDark, legDarker);
    drawCube(g, p.x + TW + 22, p.y + TH + 10, 4, 4, 25, legColor, legDark, legDarker);
    drawCube(g, p.x + TW - 12, p.y + TH + 22, 4, 4, 25, legColor, legDark, legDarker);
    drawCube(g, p.x + TW + 12, p.y + TH + 22, 4, 4, 25, legColor, legDark, legDarker);

    // Table top
    const tableColor = 0x8d6e63;
    drawCube(g, p.x + TW, p.y + TH - 8, 32, 20, 6, tableColor, darken(tableColor, 0.7), darken(tableColor, 0.5));

    g.beginFill(0xf5f5dc);

    g.beginFill(0x6f4e37);

function createPlant(gx, gy) {
    const p = iso(gx, gy);
    const g = new PIXI.Graphics();
    g.zIndex = 100 + gx + gy;

    // Shadow
    g.beginFill(0x000000, 0.25);
    g.drawEllipse(p.x + TW, p.y + TH * 2 + 4, 18, 6);
    g.endFill();

    // Pot
    const potColor = 0xd2691e;
    drawCube(g, p.x + TW, p.y + TH + 5, 16, 12, 25, potColor, darken(potColor, 0.7), darken(potColor, 0.5));

    // Soil
    g.beginFill(0x3e2723);
    g.drawEllipse(p.x + TW, p.y + TH - 18, 12, 5);
    g.endFill();

    // Leaves
    const leafColor = 0x2e7d32;
    const positions = [[0, -45], [-10, -38], [10, -38], [-6, -30], [6, -30], [0, -25]];
    positions.forEach(([dx, dy]) => {
        g.beginFill(leafColor);
        g.drawEllipse(p.x + TW + dx, p.y + TH + dy, 8, 16);
        g.endFill();
        // Leaf vein
        g.lineStyle(1, darken(leafColor, 0.7));
        g.moveTo(p.x + TW + dx, p.y + TH + dy - 12);
        g.lineTo(p.x + TW + dx, p.y + TH + dy + 10);
    });

    mainContainer.addChild(g);
}

function createLamp(gx, gy) {
    const p = iso(gx, gy);

    // Light glow
    g.beginFill(0xfffacd, 0.15);

    g.beginFill(0xfffacd, 0.1);

    g.endFill();

    // Shadow
    g.beginFill(0x000000, 0.2);
    g.drawEllipse(p.x + TW, p.y + TH * 2 + 3, 12, 5);

    // Base

function createRug(gx, gy, w, h, theme) {
    const g = new PIXI.Graphics();
    g.zIndex = 12;

    const c0 = iso(gx, gy);
    const c1 = iso(gx + w, gy);
    const c2 = iso(gx + w, gy + h);
    const c3 = iso(gx, gy + h);

    // Main rug
    g.beginFill(theme.accent, 0.6);
    g.moveTo(c0.x, c0.y + TH);
    g.lineTo(c1.x, c1.y + TH);
    g.lineTo(c2.x, c2.y + TH);
    g.lineTo(c3.x, c3.y + TH);
    g.closePath();
    g.endFill();

    // Border
    g.lineStyle(3, darken(theme.accent, 0.7), 0.8);
    g.moveTo(c0.x, c0.y + TH);
    g.lineTo(c1.x, c1.y + TH);
    g.lineTo(c2.x, c2.y + TH);
    g.lineTo(c3.x, c3.y + TH);
    g.closePath();

    // Inner pattern
    g.lineStyle(0);
    g.beginFill(lighten(theme.accent, 1.2), 0.5);
    const inset = 15;
    g.moveTo(c0.x + inset, c0.y + TH);
    g.lineTo(c1.x - inset * 0.5, c1.y + TH + inset * 0.5);
    g.lineTo(c2.x - inset, c2.y + TH);
    g.lineTo(c3.x + inset * 0.5, c3.y + TH - inset * 0.5);
    g.closePath();
    g.endFill();

    mainContainer.addChild(g);
}

function createCharacters() {
    const positions = [
        { id: 'amber', x: 3, y: 5 },
        { id: 'bella', x: 6, y: 5 },
        { id: 'emma', x: 7, y: 2 },
        { id: 'luna', x: 5, y: 6 }
    ];

    positions.forEach(({ id, x, y }) => {
        characters[id] = createCharacter(id, x, y);
        mainContainer.addChild(characters[id].container);
    });
}

function createCharacter(id, gx, gy) {
    const data = CHARACTERS[id];
    const p = iso(gx, gy);
    const container = new PIXI.Container();
    container.x = p.x + TW;
    container.y = p.y + TH - TD;
    container.zIndex = 200 + gx + gy;
    container.sortableChildren = true;

    const g = new PIXI.Graphics();
    g.zIndex = 1;

    // Shadow
    g.beginFill(0x000000, 0.35);
    g.drawEllipse(0, TH + 8, 14, 5);
    g.endFill();

    // Legs
    const legColor = 0x3d5a80;
    drawCube(g, -5, TH - 8, 5, 4, 15, legColor, darken(legColor, 0.7), darken(legColor, 0.5));
    drawCube(g, 5, TH - 8, 5, 4, 15, legColor, darken(legColor, 0.7), darken(legColor, 0.5));

    // Body
    drawCube(g, 0, TH - 25, 12, 10, 20, data.bodyColor, darken(data.bodyColor, 0.75), darken(data.bodyColor, 0.55));

    // Head
    const skinColor = 0xffdcb8;
    drawCube(g, 0, TH - 50, 14, 10, 22, skinColor, darken(skinColor, 0.85), darken(skinColor, 0.7));

    // Hair
    g.beginFill(data.hairColor);
    g.moveTo(0, TH - 72);
    g.lineTo(16, TH - 62);
    g.lineTo(0, TH - 52);
    g.lineTo(-16, TH - 62);
    g.closePath();
    g.endFill();

    g.beginFill(darken(data.hairColor, 0.8));
    g.moveTo(-16, TH - 62);
    g.lineTo(0, TH - 52);
    g.lineTo(0, TH - 50);
    g.lineTo(-14, TH - 60);
    g.closePath();
    g.endFill();

    g.beginFill(darken(data.hairColor, 0.6));
    g.moveTo(16, TH - 62);
    g.lineTo(0, TH - 52);
    g.lineTo(0, TH - 50);
    g.lineTo(14, TH - 60);
    g.closePath();
    g.endFill();

    // Eyes
    g.beginFill(0x2a2a2a);
    g.drawCircle(-5, TH - 56, 3);
    g.drawCircle(5, TH - 56, 3);
    g.endFill();

    g.beginFill(0xffffff);
    g.drawCircle(-4, TH - 57, 1.2);
    g.drawCircle(6, TH - 57, 1.2);
    g.endFill();

    // Blush
    g.beginFill(0xffb6c1, 0.5);
    g.drawEllipse(-11, TH - 52, 4, 2);
    g.drawEllipse(11, TH - 52, 4, 2);
    g.endFill();

    // Mouth
    g.beginFill(0xe08080);
    g.drawEllipse(0, TH - 48, 4, 2);
    g.endFill();

    container.addChild(g);

    // Name tag
    const nameText = new PIXI.Text(data.name, {
        fontFamily: 'Segoe UI',
        fontSize: 11,
        fontWeight: 'bold',
        fill: 0xffffff
    });
    nameText.anchor.set(0.5);
    nameText.y = TH + 20;

    const nameBg = new PIXI.Graphics();
    nameBg.beginFill(0x000000, 0.7);
    nameBg.drawRoundedRect(-nameText.width / 2 - 8, TH + 10, nameText.width + 16, 20, 10);
    nameBg.endFill();

    container.addChild(nameBg);
    container.addChild(nameText);

    // Speech bubble
    const bubble = new PIXI.Container();
    bubble.visible = false;
    const bubbleG = new PIXI.Graphics();
    const bubbleText = new PIXI.Text('', { fontFamily: 'Segoe UI', fontSize: 11, fill: 0x333333 });
    bubbleText.anchor.set(0.5);
    bubble.addChild(bubbleG);
    bubble.addChild(bubbleText);
    bubble.zIndex = 10;
    container.addChild(bubble);

    bubble.show = (text) => {
        bubbleText.text = text;
        bubbleText.y = -80;
        bubbleG.clear();
        bubbleG.beginFill(0xffffff);
        bubbleG.drawRoundedRect(-bubbleText.width / 2 - 10, -95, bubbleText.width + 20, 28, 12);
        bubbleG.moveTo(-5, -67);
        bubbleG.lineTo(5, -67);
        bubbleG.lineTo(0, -60);
        bubbleG.closePath();
        bubbleG.endFill();
        bubble.visible = true;
    };
    bubble.hide = () => { bubble.visible = false; };

    // Interaction
    container.eventMode = 'static';
    container.cursor = 'pointer';
    container.hitArea = new PIXI.Rectangle(-18, -80, 36, 110);

    container.on('pointerdown', (e) => {
        e.stopPropagation();
        showModal(id);
    });
    container.on('pointerover', () => {
        container.scale.set(1.08);
        bubble.show(getRandomGreeting());
    });
    container.on('pointerout', () => {
        container.scale.set(1);
        bubble.hide();
    });

    // Breathing animation
    let time = Math.random() * 100;
    app.ticker.add(() => {
        time += 0.03;
        container.y = p.y + TH - TD + Math.sin(time) * 2;
    });

    return {
        container,
        bubble,
        gx, gy,
        targetX: gx,
        targetY: gy,
        moving: false,
        data,
        basePos: p
    };
}

function getRandomGreeting() {
    const greetings = ['Hi!', 'Hello!', 'Hey~', 'Welcome!', 'Nice to meet you!'];
    return greetings[Math.floor(Math.random() * greetings.length)];
}

function moveCharacter(id, tx, ty) {
    const char = characters[id];
    if (!char || char.moving) return;

    tx = Math.max(0, Math.min(RW - 1, tx));
    ty = Math.max(0, Math.min(RH - 1, ty));

    char.targetX = tx;
    char.targetY = ty;
    char.moving = true;

    const targetPos = iso(tx, ty);
    const startX = char.container.x;
    const startY = char.container.y;
    const duration = 500;
    let elapsed = 0;

    const animate = (dt) => {
        elapsed += dt * 16.67;
        const t = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3);

        char.container.x = startX + (targetPos.x + TW - startX) * ease;
        char.container.y = startY + (targetPos.y + TH - TD - startY) * ease;
        char.container.zIndex = 200 + Math.round(char.gx + (tx - char.gx) * t) + Math.round(char.gy + (ty - char.gy) * t);

        if (t >= 1) {
            app.ticker.remove(animate);
            char.gx = tx;
            char.gy = ty;
            char.basePos = targetPos;
            char.moving = false;
        }
    };

    app.ticker.add(animate);
}

function gameLoop() {
    if (Math.random() < 0.003) {
        const ids = Object.keys(characters);
        const randomId = ids[Math.floor(Math.random() * ids.length)];
        const char = characters[randomId];
        char.bubble.show(getRandomGreeting());
        setTimeout(() => char.bubble.hide(), 2500);
    }
}

// UI Functions
function addChat(text, type, name = 'You') {
    const body = document.getElementById('chatBody');
    const msg = document.createElement('div');
    msg.className = 'cmsg ' + type;
    msg.innerHTML = `<span class="name">${name}:</span> ${text}`;
    body.appendChild(msg);
    body.scrollTop = body.scrollHeight;
}

function sendChat() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    addChat(text, 'user');
    input.value = '';

    setTimeout(() => {
        const responses = [
            ['Amber', 'Great idea!'],
            ['Bella', 'Love it!'],
            ['Emma', 'Sounds fun!'],
            ['Luna', 'Nice~']
        ];
        const [name, msg] = responses[Math.floor(Math.random() * responses.length)];
        addChat(msg, 'ai', name);
    }, 500 + Math.random() * 500);
}

function toggleChat() {
    const body = document.getElementById('chatBody');
    body.style.display = body.style.display === 'none' ? 'block' : 'none';
}

function changeRoom(id, btn) {
    currentRoom = id;
    document.getElementById('roomName').textContent = ROOMS[id].name;
    document.querySelectorAll('.rbtn').forEach(b => b.classList.remove('on'));
    if (btn) btn.classList.add('on');
    buildRoom();
    Object.values(characters).forEach(ch => mainContainer.addChild(ch.container));
    addChat(`Welcome to ${ROOMS[id].name}!`, 'ai', 'System');
}

function showModal(id) {
    const data = CHARACTERS[id];
    currentModalChar = data;
    document.getElementById('modalName').textContent = data.name;
    document.getElementById('modalEmoji').textContent = data.emoji;
    document.getElementById('modalSkill').textContent = data.skill;
    document.getElementById('modalPersonality').textContent = data.personality;
    document.getElementById('modalLevel').textContent = data.level;
    document.getElementById('modalDesc').textContent = data.desc;
    document.getElementById('modalBg').style.display = 'flex';
}

function closeModal(e) {
    if (!e || e.target.id === 'modalBg') {
        document.getElementById('modalBg').style.display = 'none';
    }
}

function startConversation() {
    if (currentModalChar) {
        addChat(`Hi! I'm ${currentModalChar.name}! How can I help you today?`, 'ai', currentModalChar.name);
    }
    closeModal();
}

window.changeRoom = changeRoom;
window.sendChat = sendChat;
window.toggleChat = toggleChat;
window.showModal = showModal;
window.closeModal = closeModal;
window.startConversation = startConversation;

init();
</script>
